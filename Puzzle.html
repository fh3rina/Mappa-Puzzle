<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Puzzle dei Baloss - Sfida Mensile</title>
    <style>
        :root { --primary: #27ae60; --secondary: #2c3e50; --accent: #e74c3c; --gray: #bdc3c7; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; color: var(--secondary); text-align: center; box-sizing: border-box; overflow-x: hidden; }
       .container { 
            max-width: 100%; 
            width: 100%; 
            margin: 0 auto; 
            background: white; 
            padding: 15px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            box-sizing: border-box;
            position: relative;
            left: 0;
            right: 0;
            text-align: center;
        }
        
        /* Griglia Puzzle */
        .puzzle-grid { display: grid; gap: 8px; margin: 20px auto; background: #ddd; padding: 10px; border-radius: 12px; width: fit-content; border: 2px solid var(--secondary); }
        .tile { background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 1.2rem; transition: transform 0.1s; }
        .tile:active { transform: scale(0.95); }
        .tile.empty { background: #eee; cursor: default; }

        /* Ticket Premio */
        #ticket { display: none; background: #fff3cd; border: 2px dashed #856404; padding: 15px; margin-top: 20px; border-radius: 10px; animation: pop 0.5s ease-out; }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* Controlli */
        button { background: var(--primary); color: white; border: none; padding: 15px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1rem; margin-top: 10px; }
        button:disabled { background: var(--gray); cursor: not-allowed; }
        select { padding: 12px; border-radius: 8px; margin-bottom: 10px; width: 100%; border: 1px solid #ccc; font-size: 1rem; }
        
        .status-msg { margin-top: 10px; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <h1>🧩 Puzzle dei Baloss</h1>
    <p>Risolvi il puzzle e vinci un premio reale!</p>

    <div id="setup-area">
        <label for="difficulty">Scegli la sfida di questo mese:</label>
        <select id="difficulty">
            <option value="3">Facile (3x3) - Premio: Adesivo Baloss</option>
            <option value="4">Medio (4x4) - Premio: Cappellino</option>
            <option value="5">Difficile (5x5) - Premio: Maglietta Ufficiale</option>
        </select>
        <button id="startBtn" onclick="initPuzzle()">INIZIA LA SFIDA</button>
    </div>

    <div class="status-msg" id="status-msg"></div>

    <!-- Area di gioco -->
    <div class="puzzle-grid" id="puzzle-grid" style="display:none;"></div>

    <!-- Ticket di vincita -->
    <div id="ticket">
        <p>🏆 <strong>COMPLIMENTI BALOSS!</strong></p>
        <p>Hai vinto il premio:</p>
        <h2 id="win-label">---</h2>
        <p style="font-size: 0.8rem;">Fai uno screenshot e mostralo al commerciante!<br>
        Codice sicurezza: <span id="security-code"></span></p>
    </div>
</div>

<script>
    let tiles = [];
    let currentSize = 3;
    const grid = document.getElementById('puzzle-grid');
    const startBtn = document.getElementById('startBtn');
    const statusMsg = document.getElementById('status-msg');
    const ticket = document.getElementById('ticket');

    // Premi basati sulla difficoltà
    const prizes = {
        "3": "Adesivo Baloss Limited",
        "4": "Cappellino dei Baloss",
        "5": "Maglietta Ufficiale Baloss"
    };

    // Controllo se ha già giocato questo mese
    function checkMonthlyLimit() {
        const lastWin = localStorage.getItem('lastPuzzleWin');
        if (lastWin) {
            const lastDate = new Date(lastWin);
            const now = new Date();
            if (lastDate.getMonth() === now.getMonth() && lastDate.getFullYear() === now.getFullYear()) {
                startBtn.disabled = true;
                statusMsg.innerText = "Hai già vinto il premio di questo mese! Torna il prossimo.";
                return false;
            }
        }
        return true;
    }

    function initPuzzle() {
        if (!checkMonthlyLimit()) return;

        currentSize = parseInt(document.getElementById('difficulty').value);
        tiles = Array.from({length: currentSize * currentSize - 1}, (_, i) => i + 1);
        tiles.push(null); // Spazio vuoto
        
        // Mescola i tasselli
        tiles = tiles.sort(() => Math.random() - 0.5);
        
        document.getElementById('setup-area').style.display = 'none';
        grid.style.display = 'grid';
        renderPuzzle();
    }

    function renderPuzzle() {
        grid.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
        grid.innerHTML = '';
        const tSize = Math.floor(300 / currentSize);
        
        tiles.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = `tile ${t === null ? 'empty' : ''}`;
            div.style.width = div.style.height = tSize + 'px';
            div.innerText = t || '';
            div.onclick = () => moveTile(i);
            grid.appendChild(div);
        });
    }

    function moveTile(i) {
        const emptyIdx = tiles.indexOf(null);
        const isAdj = [i-1, i+1, i-currentSize, i+currentSize].includes(emptyIdx);
        
        // Impedisce movimenti laterali "a salto" tra righe diverse
        const isSameRow = Math.floor(i / currentSize) === Math.floor(emptyIdx / currentSize);
        const isSameCol = i % currentSize === emptyIdx % currentSize;

        if ((isSameRow && Math.abs(i - emptyIdx) === 1) || (isSameCol && Math.abs(i - emptyIdx) === currentSize)) {
            [tiles[i], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[i]];
            renderPuzzle();
            checkWin();
        }
    }

    function checkWin() {
        // Controllo se i numeri sono in ordine
        const win = tiles.slice(0, -1).every((v, idx) => v === idx + 1);
        if (win) {
            grid.style.display = 'none';
            showPrize();
        }
    }

    function showPrize() {
        const prizeName = prizes[currentSize.toString()];
        document.getElementById('win-label').innerText = prizeName;
        document.getElementById('security-code').innerText = Math.floor(Math.random() * 899999 + 100000);
        ticket.style.display = 'block';
        
        // Salva la data della vincita per bloccare il mese
        localStorage.setItem('lastPuzzleWin', new Date().toISOString());
        statusMsg.innerText = "";
    }

    // Inizializza il controllo al caricamento
    checkMonthlyLimit();
</script>

</body>
</html>
